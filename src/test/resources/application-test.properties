# Perfil de teste — H2 em memoria, nunca toca o Postgres de desenvolvimento.
# MODE=PostgreSQL faz o H2 aceitar a sintaxe do dialeto usado em producao.
spring.datasource.url=jdbc:h2:mem:authtestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway desativado: o schema de teste vem das entidades JPA.
spring.flyway.enabled=false

# Chaves JWT proprias do teste — HS512 exige no minimo 64 caracteres.
jwt-secret-key=TestSecretKeyMustBeAtLeast64CharactersLongForHS512AlgorithmSoAddMore!!
jwt-expiration-ms=900000
jwt-secret-refresh-token=TestRefreshSecretAlsoNeedsSixtyFourCharactersMinimumForHS512Here!!
jwt-expiration-refresh-token=86400000

springdoc.api-docs.enabled=false

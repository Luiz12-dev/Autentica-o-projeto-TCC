# Precisa ser identica a do Core: e o unico acoplamento entre os dois servicos.
# O valor abaixo e default de DESENVOLVIMENTO — em producao, defina JWT_SECRET_KEY.
jwt-secret-key=${JWT_SECRET_KEY:MakeSureThisKeyIsReallyLongAndRandomMaybeCopyPasteFromAGenerator64Chars+}
jwt-expiration-ms=900000

jwt-secret-refresh-token=${JWT_REFRESH_SECRET:AndMakeSureThisOtherKeyIsAlsoVeryLongAndRandomAndDifferentFromAbove64Chars+}
jwt-expiration-refresh-token=86400000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbershopdb}
spring.datasource.username=${DB_USERNAME:barbershopuser}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8081



# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Para ver os SQLs sendo executados
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Garante que flush acontece
spring.jpa.properties.hibernate.jdbc.batch_size=10


server.error.include-message=always
server.error.include-stacktrace=always

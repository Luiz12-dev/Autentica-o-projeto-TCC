services:
  db:
    image: postgres:15-alpine
    container_name: barbershop_auth
    restart: always
    environment:
      POSTGRES_USER: barbershopuser
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: barbershopdb
    ports:
      - "5432:5432"
    volumes:
      # Sem isto, remover o container apaga todos os usuarios cadastrados.
      - postgres_auth_data:/var/lib/postgresql/data

volumes:
  postgres_auth_data:
